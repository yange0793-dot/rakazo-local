packages:
  - "apps/*"
  - "packages/*"
  - "infra/sandboxes/supervisor"
  - "infra/updater"

engineStrict: true
strictPeerDependencies: false
autoInstallPeers: true
saveExact: true
# pnpm 11+ reinstalls stale dependencies before `pnpm exec` and `pnpm run`. Tests that start
# nested pnpm commands could then relink node_modules under the running suite.
verifyDepsBeforeRun: false
# astro2tsx pins @emnapi/core 1.x but takes @emnapi/runtime as a peer, which otherwise resolves to
# the 2.0 beta that rolldown's wasm binding brings in and breaks `astro check`.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3

supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64

overrides:
  react: 19.3.1
  react-dom: 19.3.1
  proxy-addr@<2.0.8: 2.0.8
  dompurify@<3.4.17: 3.4.17
  ws@>=8 <8.21.1: 8.22.0
  "@grpc/grpc-js@<1.14.5": 1.14.7
  "@opentelemetry/core@>=2 <2.8.0": 2.12.0
  # Vitest takes the API as an optional peer, so each API version installs its own vitest build.
  # A test dependency that loads the second build (such as @chat-adapter/tests) breaks the
  # runner's expect: rejections then report an empty message.
  "vitest>@opentelemetry/api": 1.10.0
  # Photon's telemetry still runs on the 2.x OpenTelemetry SDK, which needs api below 1.10.
  "@photon-ai/otel>@opentelemetry/api": 1.9.1
  undici@>=7 <7.30.2: 7.30.2
  undici@>=6 <6.29.1: 6.29.1
  joi@>=18 <18.3.1: 18.3.2
  qs@<6.16.2: 6.16.2
  body-parser@>=2 <2.4.0: 2.4.0
  follow-redirects@<1.16.2: 1.16.2
  ip-address@<10.7.4: 10.7.4
  fast-uri@<3.1.9: 3.1.9
  react-server-dom-webpack@<19.3.1: 19.3.1
  "@xmldom/xmldom@>=0.8 <0.8.15": 0.8.15
  "@xmldom/xmldom@>=0.9 <0.9.12": 0.9.12
  "@prisma/config@7.10.1>effect": 3.22.1
  "@composio/client@2.0.1>effect": 3.22.1
  "eas-cli@27.7.1>diff": 8.0.3
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2 <2.1.7: 2.1.7
  compression@<1.8.2: 1.8.2
  fast-xml-parser@>=5 <5.12.0: 5.12.0
  glob@>=13 <13.0.7: 13.0.7
  # Install the Expo patches that remove Glob, within the SDK's declared ranges.
  "expo@58.0.23>@expo/cli": 58.1.20
  "expo@58.0.23>@expo/fingerprint": 0.21.10
  "@expo/config@11.0.13>sucrase": 3.35.1
  # These callers use the named Glob APIs still exported by 14.x.
  "@expo/config@11.0.13>glob": 14.0.3
  "@expo/config@55.0.10>glob": 14.0.3
  "@expo/config-plugins@10.1.2>glob": 14.0.3
  "@expo/config-plugins@55.0.7>glob": 14.0.3
  "@sentry/bundler-plugins@10.75.2>glob": 14.0.3
  "@sentry/bundler-plugins@11.8.0>glob": 14.0.3
  "archiver-utils@5.0.2>glob": 14.0.3
  js-yaml@>=4 <4.3.2: 4.3.2
  markdown-it@>=14 <14.3.3: 14.3.3
  node-forge@<1.4.3: 1.4.3
  nodemailer@<10.4.1: 10.4.1

patchedDependencies:
  dockerode@5.0.1: patches/dockerode@5.0.1.patch
  fflate@0.8.3: patches/fflate@0.8.3.patch

# Dependency install scripts run only when listed true. The false entries are
# no-ops on supported Node versions or optional native speedups with JS fallbacks.
allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  electron-winstaller: true
  esbuild: true
  koffi: true
  prisma: true
  "@alicloud/openapi-core": false
  "@google/genai": false
  core-js: false
  cpu-features: false
  dtrace-provider: false
  protobufjs: false
  ssh2: false
