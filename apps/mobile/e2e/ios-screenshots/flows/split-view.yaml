appId: com.rakazo.app
name: Split view
---
- runFlow:
    file: ../subflows/open-workspace.yaml
    env:
      RAKAZO_SCREENSHOT_WORKSPACE: Screenshot User
- openLink: rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher
- extendedWaitUntil:
    visible: .*The fixture workspace is ready.*
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-chat-beside-list
- runFlow:
    when:
      visible: Hide chats
    commands:
      - tapOn: Hide chats
      - extendedWaitUntil:
          visible: Show chats
          timeout: 5000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 02-chats-hidden
      - tapOn: Show chats
