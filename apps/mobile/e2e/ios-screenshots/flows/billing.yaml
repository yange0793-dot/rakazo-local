appId: com.rakazo.app
name: Billing
---
- runFlow:
    file: ../subflows/open-workspace.yaml
    env:
      RAKAZO_SCREENSHOT_WORKSPACE: Screenshot User
- openLink: rakazo:///billing
- extendedWaitUntil:
    visible: .*Renews.*|.*Plan.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-billing
- tapOn: Standard
- extendedWaitUntil:
    visible: Max · .*
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-billing-tiers
- openLink: rakazo:///wallet
- extendedWaitUntil:
    visible: Disconnect
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-wallet
- openLink: rakazo:///spending-limit
- extendedWaitUntil:
    visible: Amount.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-spending-limit-none
- tapOn: Amount.*
- waitForAnimationToEnd:
    timeout: 3000
- inputText: "200"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-spending-limit-amount
- tapOn:
    text: Cancel
    optional: true
