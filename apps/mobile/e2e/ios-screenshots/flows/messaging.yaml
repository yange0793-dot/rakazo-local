appId: com.rakazo.app
name: Messaging
---
- runFlow:
    file: ../subflows/open-workspace.yaml
    env:
      RAKAZO_SCREENSHOT_WORKSPACE: Screenshot User
- openLink: rakazo:///messaging
- extendedWaitUntil:
    visible: .*#launch.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-messaging
- tapOn: .*#launch.*
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-team-conversation
