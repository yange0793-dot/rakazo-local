appId: com.rakazo.app
name: Organizations
---
- runFlow:
    file: ../subflows/open-workspace.yaml
    env:
      RAKAZO_SCREENSHOT_WORKSPACE: Screenshot User
- openLink: rakazo:///account
- scrollUntilVisible:
    element: Organization.*
    direction: DOWN
    timeout: 15000
- tapOn: Organization.*
- extendedWaitUntil:
    visible: Create organization
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-account-organization
- tapOn: Create organization
- extendedWaitUntil:
    visible: Name
    timeout: 15000
- inputText: Work
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-new-organization
- tapOn: Create
- extendedWaitUntil:
    visible: .*Put your bots to work.*
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-organization-paywall
- tapOn: Account
- extendedWaitUntil:
    visible: Personal
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-organization-paywall-menu
- tapOn: Personal
- extendedWaitUntil:
    visible:
      id: organization-menu
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-organization-inbox
- openLink: rakazo:///account
- extendedWaitUntil:
    visible: Organization.*
    timeout: 15000
- tapOn: Organization.*
- extendedWaitUntil:
    visible: .*Delete organization.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-organization
- tapOn: Delete organization
- inputText: Personal
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-organization-delete-confirm
- openLink: rakazo:///
- tapOn:
    id: organization-menu
- extendedWaitUntil:
    visible: Work
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-organization-menu
