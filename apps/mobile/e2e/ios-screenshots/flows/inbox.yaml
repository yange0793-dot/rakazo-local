appId: com.rakazo.app
name: Inbox
---
- runFlow:
    file: ../subflows/open-workspace.yaml
    env:
      RAKAZO_SCREENSHOT_WORKSPACE: Screenshot User
- extendedWaitUntil:
    visible: .*Researcher.*
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-inbox
- tapOn: Activity
- extendedWaitUntil:
    visible: .*Recent.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-activity
- tapOn: Activity
- openLink: rakazo:///artifacts
- extendedWaitUntil:
    visible: .*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-artifacts
