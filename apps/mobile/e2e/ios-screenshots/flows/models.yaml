appId: com.rakazo.app
name: Models
---
- runFlow:
    file: ../subflows/open-workspace.yaml
    env:
      RAKAZO_SCREENSHOT_WORKSPACE: Screenshot User
- openLink: rakazo:///models
- extendedWaitUntil:
    visible: .*Claude Fable 5.1.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-models
- tapOn: .*Claude Fable 5.1.*
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-model-picker
- openLink: rakazo:///models
- extendedWaitUntil:
    visible: Add provider
    timeout: 15000
- tapOn: Add provider
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-add-provider
- tapOn: .*OpenRouter.*
- extendedWaitUntil:
    visible: API key
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-model-connection
