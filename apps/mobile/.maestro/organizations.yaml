appId: com.rakazo.app
name: Rakazo organizations
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- runFlow: helpers/open-workspace.yaml
- openLink: rakazo:///account
- scrollUntilVisible:
    element: Organization
    direction: DOWN
- tapOn: Organization
- extendedWaitUntil:
    visible: Create organization
    timeout: 10000
- takeScreenshot: 40-account-organization
- tapOn: Create organization
- extendedWaitUntil:
    visible: Name
    timeout: 10000
- inputText: Work
- takeScreenshot: 41-new-organization
- pressKey: Enter
- tapOn:
    text: Don’t allow
    optional: true
- extendedWaitUntil:
    visible:
      id: organization-menu
    timeout: 15000
- assertNotVisible: Researcher
- waitForAnimationToEnd
- takeScreenshot: 42-organization-inbox
- tapOn:
    id: organization-menu
- extendedWaitUntil:
    visible: Personal
    timeout: 10000
- assertVisible: Work
- takeScreenshot: 43-organization-menu
- tapOn: Personal
- tapOn:
    text: Don’t allow
    optional: true
- extendedWaitUntil:
    visible: Researcher
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 44-organization-switched
- tapOn:
    id: organization-menu
- extendedWaitUntil:
    visible: Personal
    timeout: 10000
- tapOn: Work
- extendedWaitUntil:
    notVisible: Researcher
    timeout: 15000
- openLink: rakazo:///account
- extendedWaitUntil:
    visible: Organization
    timeout: 10000
- extendedWaitUntil:
    visible: Work
    timeout: 10000
- tapOn: Organization
- extendedWaitUntil:
    visible: Delete organization
    timeout: 10000
- takeScreenshot: 45-organization
- tapOn: Delete organization
- inputText: Work
- takeScreenshot: 46-organization-delete-confirm
- hideKeyboard
- tapOn: ^Delete$
- extendedWaitUntil:
    visible: Researcher
    timeout: 15000
- assertNotVisible:
    id: organization-menu
